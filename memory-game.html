<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <style>
        :root {
            color-scheme: light;
            --primary-color: #0f766e;
            --primary-hover: #115e59;
            --button-text: #ffffff;
            --background-color: #f3f5f7;
            --surface-color: #ffffff;
            --card-back: #e8edf1;
            --card-front: #ffffff;
            --matched-surface: #e7f2f0;
            --text-color: #202a33;
            --muted-color: #697681;
            --border-color: #e1e6ea;
            --matched-color: #0f766e;
            --surface-shadow: 0 12px 32px rgba(28, 42, 54, 0.06);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --primary-color: #69c7b9;
            --primary-hover: #88d9cc;
            --button-text: #10201e;
            --background-color: #151b20;
            --surface-color: #1d252c;
            --card-back: #27333c;
            --card-front: #202a32;
            --matched-surface: #263a3a;
            --text-color: #ecf1f3;
            --muted-color: #a1adb5;
            --border-color: #33414b;
            --matched-color: #83d9cc;
            --surface-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 36px 20px;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .eyebrow {
            color: var(--primary-color);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 2.35rem);
            line-height: 1.15;
            letter-spacing: -0.045em;
            margin-bottom: 7px;
        }

        .header-copy > p:last-child {
            color: var(--muted-color);
            font-size: 0.95rem;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--surface-shadow);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .stat {
            text-align: center;
            padding: 17px 12px 16px;
        }

        .stat + .stat {
            border-left: 1px solid var(--border-color);
        }

        .stat h2 {
            color: var(--muted-color);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.45rem;
            font-weight: 650;
            font-variant-numeric: tabular-nums;
            line-height: 1.35;
            margin-top: 3px;
        }

        .rating {
            color: var(--primary-color);
            font-size: 1.15rem;
            letter-spacing: 0.08em;
        }

        .grid-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin: 0 auto 18px;
            max-width: 600px;
        }

        button {
            min-height: 42px;
            padding: 0.55rem 1rem;
            border: 1px solid transparent;
            border-radius: 7px;
            background: var(--primary-color);
            color: var(--button-text);
            cursor: pointer;
            font: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:focus-visible,
        .card:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }

        .theme-toggle {
            flex: 0 0 auto;
            background: transparent;
            border-color: var(--border-color);
            color: var(--text-color);
        }

        .theme-toggle:hover {
            background: var(--surface-color);
            border-color: var(--muted-color);
        }

        .grid-btn {
            background: transparent;
            border-color: var(--border-color);
            color: var(--text-color);
        }

        .grid-btn:hover {
            background: var(--card-back);
            border-color: var(--muted-color);
        }

        .grid-btn.active,
        .grid-btn.active:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: var(--button-text);
        }

        .grid-label {
            color: var(--muted-color);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .game-grid {
            display: grid;
            gap: 12px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .grid-4x4 {
            grid-template-columns: repeat(4, 1fr);
            max-width: 500px;
        }

        .grid-6x6 {
            grid-template-columns: repeat(6, 1fr);
            max-width: 600px;
        }

        .card {
            aspect-ratio: 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.45s;
            cursor: pointer;
        }

        .card[aria-pressed="true"] {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.35rem, 4vw, 2rem);
            box-shadow: 0 3px 9px rgba(20, 35, 45, 0.04);
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        .card-front {
            background: var(--card-front);
            color: var(--text-color);
            transform: rotateY(180deg);
        }

        .card-back {
            background: var(--card-back);
            color: var(--muted-color);
        }

        .card-back::after {
            content: "";
            width: 8px;
            height: 8px;
            border: 2px solid currentColor;
            border-radius: 2px;
            opacity: 0.65;
            transform: rotate(45deg);
        }

        .card.matched .card-front {
            background: var(--matched-surface);
            border-color: var(--primary-color);
            color: var(--matched-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .modal-content {
            background: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: var(--surface-shadow);
        }

        .best-scores {
            margin: 34px auto 0;
            text-align: center;
            max-width: 600px;
        }

        .best-scores h2 {
            font-size: 1.1rem;
            letter-spacing: -0.02em;
        }

        .scores-list {
            margin: 12px auto 0;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 16px;
            color: var(--muted-color);
            font-size: 0.88rem;
            box-shadow: var(--surface-shadow);
        }

        .scores-list p {
            padding: 8px 0;
        }

        .scores-list p + p {
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }

            .header {
                margin-bottom: 22px;
                flex-wrap: wrap;
            }

            .header-copy {
                flex-basis: 100%;
            }

            .header-copy > p:last-child {
                font-size: 0.86rem;
            }

            .grid-selector {
                gap: 8px;
            }

            .grid-selector button {
                min-height: 40px;
                padding: 0.45rem 0.7rem;
            }

            .game-grid {
                gap: 8px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 20px 12px;
            }

            .header {
                align-items: flex-start;
                gap: 10px;
            }

            .theme-toggle {
                padding: 0.45rem 0.6rem;
                font-size: 0.75rem;
            }

            .grid-label {
                font-size: 0.66rem;
            }

            .grid-selector button {
                font-size: 0.78rem;
            }

            .game-grid {
                gap: 6px;
            }
        }

        .grid-6x6 .card-face {
            font-size: clamp(1rem, 3vw, 1.65rem);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Game header with title and instructions -->
        <header class="header">
            <div class="header-copy">
                <p class="eyebrow">Focus &amp; recall</p>
                <h1>Memory Game</h1>
                <p>Find every pair in as few moves as possible.</p>
            </div>
            <button class="theme-toggle" type="button" aria-pressed="false">
                Switch to dark mode
            </button>
        </header>

        <!-- Game statistics panel -->
        <div class="controls">
            <div class="stat">
                <h2>Moves</h2>
                <p class="stat-value moves" aria-live="polite">0</p>
            </div>
            <div class="stat">
                <h2>Time</h2>
                <p class="stat-value timer" aria-live="polite">00:00</p>
            </div>
            <div class="stat">
                <h2>Rating</h2>
                <p class="stat-value rating" aria-live="polite">★★★</p>
            </div>
        </div>

        <!-- Grid size selector -->
        <div class="grid-selector">
            <span class="grid-label">Board size</span>
            <button class="grid-btn active" data-size="4">4x4 Grid</button>
            <button class="grid-btn" data-size="6">6x6 Grid</button>
        </div>

        <!-- Game grid -->
        <div class="game-grid grid-4x4" role="grid" aria-label="Memory Game Grid"></div>

        <!-- Best scores section -->
        <div class="best-scores">
            <h2>Best Scores</h2>
            <div class="scores-list"></div>
        </div>
    </div>

    <!-- Win modal -->
    <div class="modal" role="dialog" aria-label="Game Complete">
        <div class="modal-content">
            <h2>Congratulations!</h2>
            <p>You've completed the game!</p>
            <p class="final-stats"></p>
            <button class="play-again">Play Again</button>
        </div>
    </div>

    <script>
        // Game state management
        const gameState = {
            moves: 0,
            matches: 0,
            timer: 0,
            timerInterval: null,
            firstCard: null,
            secondCard: null,
            canFlip: true,
            gridSize: 4,
            totalPairs: 8,
            gameStarted: false
        };

        // DOM Elements
        const elements = {
            grid: document.querySelector('.game-grid'),
            moves: document.querySelector('.moves'),
            timer: document.querySelector('.timer'),
            rating: document.querySelector('.rating'),
            modal: document.querySelector('.modal'),
            finalStats: document.querySelector('.final-stats'),
            gridButtons: document.querySelectorAll('.grid-btn'),
            scoresList: document.querySelector('.scores-list'),
            themeToggle: document.querySelector('.theme-toggle')
        };

        const themeStorageKey = 'memoryGameTheme';

        // Apply the saved theme, defaulting to light to preserve the original appearance.
        function applyTheme(theme) {
            const isDark = theme === 'dark';
            document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
            elements.themeToggle.textContent = `Switch to ${isDark ? 'light' : 'dark'} mode`;
            elements.themeToggle.setAttribute('aria-label', `Switch to ${isDark ? 'light' : 'dark'} mode`);
            elements.themeToggle.setAttribute('aria-pressed', String(isDark));
        }

        // Card symbols (emojis) for both grid sizes
        const symbols = {
            '4x4': ['●', '◆', '▲', '■', '★', '✚', '⬟', '◐'],
            '6x6': ['●', '◆', '▲', '■', '★', '✚', '⬟', '◐', '✦', '⬢',
                   '◈', '✿', '⊙', '◉', '▰', '△', '⬡', '✣']
        };

        // Shuffle array using Fisher-Yates algorithm
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Create a single card element
        function createCard(symbol, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('role', 'gridcell');
            card.setAttribute('aria-pressed', 'false');
            card.setAttribute('tabindex', '0');
            card.setAttribute('aria-label', `Card ${index + 1}`);
            
            card.innerHTML = `
                <div class="card-face card-front">${symbol}</div>
                <div class="card-face card-back"></div>
            `;
            
            card.dataset.symbol = symbol;
            return card;
        }

        // Initialize or reset game grid
        function initializeGrid() {
            // Clear existing grid and reset game state
            elements.grid.innerHTML = '';
            gameState.moves = 0;
            gameState.matches = 0;
            gameState.firstCard = null;
            gameState.secondCard = null;
            gameState.canFlip = true;
            gameState.gameStarted = false;
            
            // Reset display elements
            elements.moves.textContent = '0';
            elements.rating.textContent = '★★★';
            clearInterval(gameState.timerInterval);
            gameState.timer = 0;
            elements.timer.textContent = '00:00';

            // Set up grid based on selected size
            const currentSymbols = symbols[`${gameState.gridSize}x${gameState.gridSize}`];
            gameState.totalPairs = currentSymbols.length;
            
            // Update grid class for correct layout
            elements.grid.className = `game-grid grid-${gameState.gridSize}x${gameState.gridSize}`;
            
            // Create and shuffle cards
            const shuffledSymbols = shuffle([...currentSymbols, ...currentSymbols]);
            shuffledSymbols.forEach((symbol, index) => {
                elements.grid.appendChild(createCard(symbol, index));
            });
        }

        // Start game timer
        function startTimer() {
            if (!gameState.gameStarted) {
                gameState.gameStarted = true;
                gameState.timerInterval = setInterval(() => {
                    gameState.timer++;
                    const minutes = Math.floor(gameState.timer / 60);
                    const seconds = gameState.timer % 60;
                    elements.timer.textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }, 1000);
            }
        }

        // Update star rating based on number of moves
        function updateRating() {
            const moves = gameState.moves;
            const maxMoves = gameState.totalPairs * 2.5;
            
            if (moves <= maxMoves) {
                elements.rating.textContent = '★★★';
            } else if (moves <= maxMoves * 1.5) {
                elements.rating.textContent = '★★☆';
            } else {
                elements.rating.textContent = '★☆☆';
            }
        }

        // Check for win condition and handle game completion
        function checkWin() {
            if (gameState.matches === gameState.totalPairs) {
                clearInterval(gameState.timerInterval);
                
                // Save score to localStorage
                const score = {
                    moves: gameState.moves,
                    time: gameState.timer,
                    rating: elements.rating.textContent,
                    gridSize: gameState.gridSize,
                    date: new Date().toISOString()
                };
                
                const scores = JSON.parse(localStorage.getItem('memoryGameScores') || '[]');
                scores.push(score);
                scores.sort((a, b) => a.moves - b.moves);
                localStorage.setItem('memoryGameScores', JSON.stringify(scores.slice(0, 5)));
                
                // Show win modal
                elements.finalStats.textContent = `
                    Moves: ${gameState.moves}
                    Time: ${elements.timer.textContent}
                    Rating: ${elements.rating.textContent}
                `;
                elements.modal.style.display = 'flex';
                
                updateScoresList();
            }
        }

        // Update the display of best scores
        function updateScoresList() {
            const scores = JSON.parse(localStorage.getItem('memoryGameScores') || '[]');
            elements.scoresList.innerHTML = scores.length ? 
                scores.map((score, index) => `
                    <p>${index + 1}. ${score.gridSize}x${score.gridSize} Grid - 
                       ${score.moves} Moves, 
                       Time: ${Math.floor(score.time / 60)}:${(score.time % 60).toString().padStart(2, '0')}, 
                       Rating: ${score.rating}</p>
                `).join('') :
                '<p>No scores yet. Start playing to set some records!</p>';
        }

        // Handle card flip logic
        function flipCard(card) {
            if (!gameState.canFlip || card.classList.contains('matched') || 
                card.getAttribute('aria-pressed') === 'true') return;

            startTimer();
            card.setAttribute('aria-pressed', 'true');

            if (!gameState.firstCard) {
                gameState.firstCard = card;
            } else if (!gameState.secondCard && card !== gameState.firstCard) {
                gameState.secondCard = card;
                gameState.canFlip = false;
                gameState.moves++;
                elements.moves.textContent = gameState.moves;
                updateRating();

                // Check for match
                if (gameState.firstCard.dataset.symbol === gameState.secondCard.dataset.symbol) {
                    gameState.matches++;
                    gameState.firstCard.classList.add('matched');
                    gameState.secondCard.classList.add('matched');
                    gameState.firstCard.setAttribute('aria-label', 'Matched');
                    gameState.secondCard.setAttribute('aria-label', 'Matched');
                    gameState.firstCard = null;
                    gameState.secondCard = null;
                    gameState.canFlip = true;
                    checkWin();
                } else {
                    // No match - flip cards back
                    setTimeout(() => {
                        gameState.firstCard.setAttribute('aria-pressed', 'false');
                        gameState.secondCard.setAttribute('aria-pressed', 'false');
                        gameState.firstCard = null;
                        gameState.secondCard = null;
                        gameState.canFlip = true;
                    }, 1000);
                }
            }
        }

        // Event Listeners
        elements.grid.addEventListener('click', (e) => {
            const card = e.target.closest('.card');
            if (card) flipCard(card);
        });

        elements.grid.addEventListener('keydown', (e) => {
            const card = e.target.closest('.card');
            if (card && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                flipCard(card);
            }
        });

        document.querySelector('.play-again').addEventListener('click', () => {
            elements.modal.style.display = 'none';
            initializeGrid();
        });

        elements.gridButtons.forEach(button => {
            button.addEventListener('click', () => {
                const size = parseInt(button.dataset.size);
                if (size !== gameState.gridSize) {
                    gameState.gridSize = size;
                    elements.gridButtons.forEach(btn => btn.classList.toggle('active'));
                    initializeGrid();
                }
            });
        });

        applyTheme(localStorage.getItem(themeStorageKey) === 'dark' ? 'dark' : 'light');

        elements.themeToggle.addEventListener('click', () => {
            const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            applyTheme(nextTheme);
            localStorage.setItem(themeStorageKey, nextTheme);
        });

        // Initialize game
        updateScoresList();
        initializeGrid();
    </script>
</body>
</html>
